<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>키워드 · T-ASSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
      :root {
        --canvas: #ffffff;
        --text: #424242;
        --fg: #2f3438;
        --muted: #828c94;
        --action: #00a1ff;
        --hairline: #e0e0e0;
        --naver: #03c75a;
        --google: #4285f4;
        --naver-click: #0b6e3d;
        --google-click: #1a73e8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: "Pretendard Variable", sans-serif;
        font-size: 15px;
        line-height: 15px;
        letter-spacing: -0.3px;
        font-weight: 400;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; }
      .kicker { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
      h1 { font-size: 30px; line-height: 30px; font-weight: 400; letter-spacing: -0.3px; margin: 0 0 20px; color: var(--fg); }
      h2 { font-size: 16px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 12px; color: var(--fg); }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 28px 0 12px; }
      .section-head h2 { margin: 0; }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
      .tabs, .grains, .filters { display: flex; gap: 6px; align-items: center; }
      .filters { gap: 10px; }
      .filters .grains + .grains {
        padding-left: 10px;
        border-left: 1px solid var(--hairline);
      }
      button { font-family: inherit; letter-spacing: -0.3px; cursor: pointer; }
      .tab {
        height: 32px; padding: 0 8px; border: 1px solid var(--hairline); border-radius: 4px;
        background: transparent; color: var(--fg); font-size: 14px; line-height: 18px;
      }
      .tab.on { border: 0; background: transparent; color: var(--action); font-size: 16px; line-height: 20px; font-weight: 700; height: 20px; padding: 0; }
      .tab[data-id="NAVER"].on { color: var(--naver); }
      .tab[data-id="GOOGLE"].on { color: var(--google); }
      .grain {
        height: 32px; padding: 0 8px; border: 1px solid var(--hairline); border-radius: 4px;
        background: transparent; color: var(--fg); font-size: 14px; line-height: 18px;
      }
      .grain.on { border-color: var(--action); background: var(--action); color: #ffffff; }
      .axis-row { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
      .pager {
        width: 14px; height: 14px; flex: none; padding: 0; margin-top: 0;
        border: 0; background: transparent; color: var(--muted); font-size: 12px; line-height: 14px;
      }
      .pager:disabled { color: var(--hairline); cursor: default; }
      .period-label { min-width: 148px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--fg); }
      .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
      article .label { color: var(--muted); font-size: 15px; line-height: 15px; }
      article .value { font-size: 30px; line-height: 30px; font-weight: 400; margin-top: 6px; color: var(--fg); }
      .plot-frame {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 36px;
        column-gap: 8px;
        align-items: start;
      }
      .y-axis {
        height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        line-height: 12px;
      }
      .y-axis.left { text-align: right; }
      .y-axis.right { text-align: left; }
      .plot-main { position: relative; min-width: 0; }
      .gridlines { position: absolute; left: 0; right: 0; top: 0; height: 180px; pointer-events: none; }
      .gridlines i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hairline); }
      .chart {
        display: grid;
        grid-template-columns: repeat(14, minmax(0, 1fr));
        align-items: end;
        height: 180px;
        width: 100%;
      }
      .col {
        width: 100%;
        height: 180px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        cursor: pointer;
      }
      .col.on { box-shadow: inset 0 -2px 0 var(--fg); }
      .track {
        height: 180px;
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
      }
      .seg { width: 7px; min-height: 1px; border-radius: 1px 1px 0 0; }
      .col.one .seg { width: 10px; }
      .seg.NAVER { background: var(--naver); }
      .seg.GOOGLE { background: var(--google); }
      .click-svg {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 180px;
        width: 100%;
        pointer-events: none;
      }
      .click-svg polyline { vector-effect: non-scaling-stroke; }
      .legend .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: middle; }
      .legend .line {
        display: inline-block;
        width: 14px;
        height: 0;
        border-top: 2px solid currentColor;
        margin-right: 6px;
        vertical-align: middle;
      }
      .axis {
        display: grid;
        grid-template-columns: repeat(14, minmax(0, 1fr));
        flex: 1;
        min-width: 0;
        height: 40px;
        color: var(--muted);
        font-size: 12px;
        line-height: 14px;
      }
      .axis span {
        width: 100%;
        text-align: center;
        white-space: nowrap;
      }
      .axis span.show.vert {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        height: 40px;
        line-height: 12px;
      }
      .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 15px; color: var(--muted); margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 12px 8px 12px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; line-height: 24px; vertical-align: top; }
      th { color: var(--muted); font-weight: 400; }
      td.num, th.num { text-align: right; }
      .meta { color: var(--muted); font-size: 15px; line-height: 24px; margin-top: 12px; }
      .foot { margin-top: 40px; }
      .foot a { color: var(--muted); font-weight: 400; font-size: 15px; line-height: 15px; }
      a { color: var(--action); text-decoration: none; font-weight: 700; font-size: 16px; line-height: 20px; }
      .tag { font-weight: 400; font-size: 15px; margin-right: 6px; }
      .tag.NAVER { color: var(--naver); }
      .tag.GOOGLE { color: var(--google); }
      .toggle {
        width: 18px; border: 0; background: transparent; color: var(--muted);
        font-size: 12px; padding: 0; margin-right: 4px; line-height: 24px;
      }
      .name { display: flex; align-items: center; }
      .indent-1 { padding-left: 20px; }
      .indent-2 { padding-left: 40px; }
      .chip { color: var(--muted); font-size: 13px; margin-left: 6px; }
      .empty { color: var(--muted); padding: 24px 0; }
      .score { color: var(--fg); font-size: 13px; line-height: 18px; white-space: nowrap; }
      .tip {
        position: absolute;
        z-index: 6;
        display: none;
        background: var(--canvas);
        border: 1px solid var(--hairline);
        padding: 8px 10px;
        color: var(--fg);
        font-size: 13px;
        line-height: 18px;
        pointer-events: none;
        white-space: nowrap;
      }
      .tip.on { display: block; }
      .tip-date { font-weight: 700; margin-bottom: 8px; }
      .tip-plat { margin-top: 6px; }
      .tip-plat:first-of-type { margin-top: 0; }
      .tip-metrics { display: grid; grid-template-columns: auto auto; gap: 2px 16px; margin-top: 2px; color: var(--text); }
      .tip-metrics .k { color: var(--muted); }
      @media (max-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <script src="site.js"></script>
    <script src="nav.js"></script>
    <div class="wrap">
      <div class="kicker">T-ASSI 키워드 광고</div>
      <h1>네이버 · 구글 검색광고</h1>
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="filters">
          <div class="grains" id="grains"></div>
          <div class="grains" id="statusFilter"></div>
        </div>
      </div>
      <div id="app"></div>
      <p class="meta foot"></p>
    </div>
    <script>
      const labels = { ALL: "종합", NAVER: "네이버", GOOGLE: "구글" };
      const grainLabels = { day: "일간", week: "주간", month: "월간" };
      const statusLabels = { active: "활성", all: "전체" };
      let report = null;
      let current = "ALL";
      let grain = "day";
      let statusFilter = "active";
      let selectedKey = null;
      let chartPage = 0;
      const open = new Set();
      let initedOpen = false;
      const PAGE_SIZE = 14;
      const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
      const fmt1 = (n) => Number(n || 0).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
      const won = (n) => `${fmt(Math.round(n || 0))}원`;

      function kstToday() {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
      }
      function addDays(ymd, delta) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        date.setUTCDate(date.getUTCDate() + delta);
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(date);
      }
      function weekStart(ymd) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        const offset = (date.getUTCDay() + 6) % 7;
        return addDays(ymd, -offset);
      }
      function periodKey(ymd) {
        if (grain === "month") return ymd.slice(0, 7);
        if (grain === "week") return weekStart(ymd);
        return ymd;
      }
      function periodLabel(key) {
        if (!key) return "";
        if (grain === "month") {
          const [y, m] = key.split("-");
          return `${y}년 ${Number(m)}월`;
        }
        if (grain === "week") return `${shortDay(key)} – ${shortDay(addDays(key, 6))}`;
        return shortDay(key);
      }
      function shortDay(ymd) {
        const [, m, d] = (ymd || "").split("-");
        return `${Number(m)}/${Number(d)}`;
      }
      function axisText(key) {
        if (grain === "month") return `${Number(key.slice(5))}월`;
        return shortDay(key);
      }
      function niceCeil(n) {
        if (n <= 0) return 1;
        const pow = Math.pow(10, Math.floor(Math.log10(n)));
        const d = n / pow;
        const nice = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => d <= s) || 10;
        const v = nice * pow;
        return v >= 10 ? Math.round(v) : Math.round(v * 100) / 100;
      }
      function dataEnd() {
        const rangeEnd = report?.dateRange?.[1];
        const lastDay = report?.days?.length ? report.days[report.days.length - 1].date : "";
        const end = [rangeEnd, lastDay].filter(Boolean).sort().at(-1);
        const today = kstToday();
        return end && end < today ? end : today;
      }
      function currentPeriodKey() { return periodKey(dataEnd()); }
      function previousPeriodKey(key) {
        if (grain === "month") {
          const [y, m] = key.split("-").map(Number);
          const date = new Date(Date.UTC(y, m - 2, 1));
          return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}`;
        }
        if (grain === "week") return addDays(key, -7);
        return addDays(key, -1);
      }
      function campaigns() {
        const all = report.campaigns || [];
        if (current === "ALL") return all;
        return all.filter((c) => c.platform === current);
      }
      function isInactive(status) {
        return /중지|OFF|일시중지|paused|운영\s*불가능|사용\s*중지|제한/i.test(status || "");
      }
      function isJunkKeyword(row) {
        return /^(on\/?off|대시보드|현재\s*입찰가|광고\s*연관|클릭\s*기대|품질지수|품질평가|노출수|클릭수|클릭률)/i.test((row.name || "").trim());
      }
      function visibleStatus(row) {
        if (statusFilter === "all") return true;
        if (isInactive(row.status)) return false;
        if (!row.status && Array.isArray(row.groups)) {
          const keywords = row.groups.flatMap((group) => group.keywords || []);
          if (keywords.length && keywords.every((kw) => isInactive(kw.status))) return false;
        }
        return true;
      }
      function tableCamps() {
        return campaigns()
          .filter(visibleStatus)
          .map((camp) => ({
            ...camp,
            groups: (camp.groups || [])
              .filter(visibleStatus)
              .map((group) => ({
                ...group,
                keywords: (group.keywords || []).filter((kw) => !isJunkKeyword(kw) && visibleStatus(kw)),
              })),
          }));
      }
      function periodMetrics(byDate) {
        const next = { impressions: 0, clicks: 0, cost: 0, conversions: 0, ctr: 0, cpc: 0 };
        if (!byDate || !selectedKey) return next;
        for (const [date, row] of Object.entries(byDate)) {
          if (periodKey(date) !== selectedKey) continue;
          const imp = Array.isArray(row) ? row[0] : row.impressions;
          const clk = Array.isArray(row) ? row[1] : row.clicks;
          const cost = Array.isArray(row) ? row[2] : row.cost;
          const conv = Array.isArray(row) ? row[3] : row.conversions;
          next.impressions += imp || 0;
          next.clicks += clk || 0;
          next.cost += cost || 0;
          next.conversions += conv || 0;
        }
        next.ctr = next.impressions ? (next.clicks / next.impressions) * 100 : 0;
        next.cpc = next.clicks ? next.cost / next.clicks : 0;
        return next;
      }
      function rollup(rows) {
        const impressions = rows.reduce((sum, row) => sum + (row.impressions || 0), 0);
        const clicks = rows.reduce((sum, row) => sum + (row.clicks || 0), 0);
        const cost = rows.reduce((sum, row) => sum + (row.cost || 0), 0);
        const conversions = rows.reduce((sum, row) => sum + (row.conversions || 0), 0);
        return {
          impressions,
          clicks,
          cost,
          conversions,
          ctr: impressions ? (clicks / impressions) * 100 : 0,
          cpc: clicks ? cost / clicks : 0,
        };
      }
      function periodCamps() {
        return tableCamps()
          .map((camp) => {
            const groups = (camp.groups || [])
              .map((group) => {
                const metrics = periodMetrics(group.byDate);
                const keywordsAll = group.keywords || [];
                const fromKw = keywordsAll.length ? rollup(keywordsAll.map((kw) => ({ ...periodMetrics(kw.byDate) }))) : metrics;
                const used = metrics.impressions || metrics.clicks ? metrics : fromKw;
                if (!used.impressions && !used.clicks) return null;
                if (!open.has(group.id)) return { ...group, keywords: [], ...used };
                const keywords = keywordsAll
                  .map((kw) => ({ ...kw, ...periodMetrics(kw.byDate) }))
                  .filter((kw) => kw.impressions || kw.clicks);
                return { ...group, keywords, ...used };
              })
              .filter(Boolean);
            if (!groups.length) return null;
            return { ...camp, groups, ...rollup(groups) };
          })
          .filter(Boolean);
      }
      function emptyBucket(key) {
        return { key, impressions: 0, clicks: 0, cost: 0, conversions: 0, naver: { impressions: 0, clicks: 0, cost: 0, conversions: 0 }, google: { impressions: 0, clicks: 0, cost: 0, conversions: 0 } };
      }
      function addDayCell(bucket, plat, cell) {
        const imp = Array.isArray(cell) ? cell[0] : cell.impressions;
        const clk = Array.isArray(cell) ? cell[1] : cell.clicks;
        const cost = Array.isArray(cell) ? cell[2] : cell.cost;
        const conv = Array.isArray(cell) ? cell[3] : cell.conversions;
        bucket[plat].impressions += imp || 0;
        bucket[plat].clicks += clk || 0;
        bucket[plat].cost += cost || 0;
        bucket[plat].conversions += conv || 0;
      }
      function buckets() {
        const map = new Map();
        for (const day of report.days || []) {
          const key = periodKey(day.date);
          if (!map.has(key)) map.set(key, emptyBucket(key));
          const bucket = map.get(key);
          if (current === "ALL" || current === "NAVER") addDayCell(bucket, "naver", day.naver);
          if (current === "ALL" || current === "GOOGLE") addDayCell(bucket, "google", day.google);
        }
        for (const bucket of map.values()) {
          bucket.impressions = bucket.naver.impressions + bucket.google.impressions;
          bucket.clicks = bucket.naver.clicks + bucket.google.clicks;
          bucket.cost = bucket.naver.cost + bucket.google.cost;
          bucket.conversions = (bucket.naver.conversions || 0) + (bucket.google.conversions || 0);
        }
        return [...map.values()].sort((a, b) => a.key.localeCompare(b.key));
      }
      function bindChrome() {
        const tabs = document.getElementById("tabs");
        const grains = document.getElementById("grains");
        const status = document.getElementById("statusFilter");
        if (!tabs.dataset.ready) {
          tabs.innerHTML = ["ALL", "NAVER", "GOOGLE"].map((id) =>
            `<button class="tab" data-id="${id}">${labels[id]}</button>`
          ).join("");
          tabs.querySelectorAll("button").forEach((btn) => {
            btn.onclick = () => { current = btn.dataset.id; selectedKey = null; chartPage = 0; render(); };
          });
          grains.innerHTML = ["day", "week", "month"].map((id) =>
            `<button class="grain" data-id="${id}">${grainLabels[id]}</button>`
          ).join("");
          grains.querySelectorAll("button").forEach((btn) => {
            btn.onclick = () => { grain = btn.dataset.id; selectedKey = null; chartPage = 0; render(); };
          });
          status.innerHTML = ["active", "all"].map((id) =>
            `<button class="grain" data-id="${id}">${statusLabels[id]}</button>`
          ).join("");
          status.querySelectorAll("button").forEach((btn) => {
            btn.onclick = () => { statusFilter = btn.dataset.id; render(); };
          });
          tabs.dataset.ready = "1";
        }
        tabs.querySelectorAll("button").forEach((btn) => btn.classList.toggle("on", btn.dataset.id === current));
        grains.querySelectorAll("button").forEach((btn) => btn.classList.toggle("on", btn.dataset.id === grain));
        status.querySelectorAll("button").forEach((btn) => btn.classList.toggle("on", btn.dataset.id === statusFilter));
      }
      function scoreCell(row, extra) {
        if (extra) return extra;
        return row.relevanceScore || row.expectedCtr || row.qualityScore || "";
      }
      function metricCells(row, isKeyword) {
        const rel = isKeyword ? (row.relevanceScore || row.qualityScore || "-") : "";
        const exp = isKeyword ? (row.expectedCtr || "-") : "";
        return `
          ${isKeyword ? `<td class="score">${rel}</td><td class="score">${exp}</td>` : `<td></td><td></td>`}
          <td class="num">${fmt(row.impressions)}</td>
          <td class="num">${fmt(row.clicks)}</td>
          <td class="num">${fmt(row.conversions || 0)}</td>
          <td class="num">${fmt1(row.ctr)}</td>
          <td class="num">${won(row.cpc)}</td>
          <td class="num">${won(row.cost)}</td>
        `;
      }
      function render() {
        if (!report) return;
        bindChrome();
        const rows = buckets();
        const byKey = new Map(rows.map((row) => [row.key, row]));
        const oldest = rows.length ? rows.reduce((a, b) => (a.key < b.key ? a : b)).key : currentPeriodKey();
        let span = 0;
        for (let key = currentPeriodKey(); key >= oldest && span < 400; key = previousPeriodKey(key)) span += 1;
        if (!rows.length) span = PAGE_SIZE;
        const pageCount = Math.max(1, Math.ceil(span / PAGE_SIZE));
        if (chartPage > pageCount - 1) chartPage = pageCount - 1;
        if (chartPage < 0) chartPage = 0;
        let cursor = currentPeriodKey();
        for (let i = 0; i < chartPage * PAGE_SIZE; i++) cursor = previousPeriodKey(cursor);
        const slots = [];
        for (let i = 0; i < PAGE_SIZE; i++) {
          slots.push(byKey.get(cursor) || emptyBucket(cursor));
          cursor = previousPeriodKey(cursor);
        }
        slots.reverse();
        const latestData = [...slots].reverse().find((row) => row.impressions || row.clicks);
        if (!selectedKey || !slots.some((row) => row.key === selectedKey)) selectedKey = (latestData || slots.at(-1)).key;
        const selected = slots.find((row) => row.key === selectedKey) || slots[0];
        const camps = periodCamps();
        const plats = current === "ALL" ? ["NAVER", "GOOGLE"] : [current];
        const ticks = (top) => [top, top / 2, 0].map((t) => (Number.isInteger(t) ? t : Math.round(t * 10) / 10));
        const maxImp = Math.max(1, ...slots.flatMap((row) => plats.map((p) => row[p === "NAVER" ? "naver" : "google"].impressions)));
        const maxClk = Math.max(1, ...slots.flatMap((row) => plats.map((p) => row[p === "NAVER" ? "naver" : "google"].clicks)));
        const topImp = niceCeil(maxImp);
        const topClk = niceCeil(maxClk);
        const yImp = ticks(topImp);
        const yClk = ticks(topClk);
        const canNewer = chartPage > 0;
        const canOlder = chartPage < pageCount - 1;
        const kwCount = camps.reduce((n, c) => n + c.groups.reduce((m, g) => m + g.keywords.length, 0), 0);
        const sum = camps.reduce((acc, c) => ({
          impressions: acc.impressions + (c.impressions || 0),
          clicks: acc.clicks + (c.clicks || 0),
          cost: acc.cost + (c.cost || 0),
          ctr: 0, cpc: 0,
        }), { impressions: 0, clicks: 0, cost: 0 });
        sum.ctr = sum.impressions ? (sum.clicks / sum.impressions) * 100 : 0;
        sum.cpc = sum.clicks ? sum.cost / sum.clicks : 0;

        const clickLine = (plat) => {
          const color = plat === "NAVER" ? "var(--naver-click)" : "var(--google-click)";
          const pts = slots.map((row, i) => {
            const v = row[plat === "NAVER" ? "naver" : "google"].clicks;
            const x = ((i + 0.5) / slots.length) * 100;
            const y = 180 - (v / topClk) * 180;
            return `${x},${y}`;
          }).join(" ");
          return `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}" />`;
        };
        const clickSvg = `<svg class="click-svg" viewBox="0 0 100 180" preserveAspectRatio="none">${plats.map((id) => clickLine(id)).join("")}</svg>`;
        const tableRows = [];
        if (!report.campaigns?.length) {
          tableRows.push(`<tr><td colspan="9" class="empty">수집된 캠페인이 없습니다. 크롤이 끝나면 여기에 채워집니다.</td></tr>`);
        } else if (!camps.length) {
          tableRows.push(`<tr><td colspan="9" class="empty">${periodLabel(selected.key)}에 노출·클릭이 없습니다.</td></tr>`);
        } else {
          tableRows.push(`<tr><td class="meta" style="border:0">캠페인 ${camps.length}개 · 키워드 ${kwCount}개</td><td></td>${metricCells(sum, false)}</tr>`);
        }
        for (const camp of camps) {
          const campOpen = open.has(camp.id);
          tableRows.push(`<tr>
            <td><div class="name"><button class="toggle" data-id="${camp.id}">${campOpen ? "▼" : "▶"}</button>${current === "ALL" ? `<span class="tag ${camp.platform}">${labels[camp.platform]}</span>` : ""}${camp.name}</div></td>
            <td>${camp.status || ""}</td>${metricCells(camp, false)}</tr>`);
          if (!campOpen) continue;
          for (const group of camp.groups || []) {
            const groupOpen = open.has(group.id);
            tableRows.push(`<tr>
              <td><div class="name indent-1"><button class="toggle" data-id="${group.id}">${groupOpen ? "▼" : "▶"}</button>${group.name}</div></td>
              <td>${group.status || ""}</td>${metricCells(group, false)}</tr>`);
            if (!groupOpen) continue;
            for (const kw of (group.keywords || []).filter((row) => !/^(on\/?off|대시보드|현재\s*입찰가|광고\s*연관|클릭\s*기대|품질지수|품질평가|노출수|클릭수|클릭률)/i.test((row.name || "").trim()))) {
              tableRows.push(`<tr>
                <td><div class="name indent-2">${kw.name || "-"}${kw.matchType ? `<span class="chip">[${kw.matchType}]</span>` : ""}</div></td>
                <td>${kw.status || ""}</td>${metricCells(kw, true)}</tr>`);
            }
          }
        }

        document.getElementById("app").innerHTML = `
          <div class="toolbar"><div class="period-label">${periodLabel(selected.key)}</div></div>
          <div class="cards">
            <article><div class="label">${grainLabels[grain]} 노출</div><div class="value">${fmt(selected.impressions)}</div></article>
            <article><div class="label">${grainLabels[grain]} 클릭</div><div class="value">${fmt(selected.clicks)}</div></article>
            <article><div class="label">기간 노출</div><div class="value">${fmt(rows.reduce((s, r) => s + r.impressions, 0))}</div></article>
            <article><div class="label">기간 비용</div><div class="value">${won(rows.reduce((s, r) => s + r.cost, 0))}</div></article>
          </div>
          <h2>노출 · 클릭</h2>
          <div class="legend">
            ${plats.map((id) => `<span><span class="swatch" style="background:var(--${id.toLowerCase()})"></span>${labels[id]} 노출</span>`).join("")}
            ${plats.map((id) => `<span style="color:var(--${id.toLowerCase()}-click)"><span class="line"></span>${labels[id]} 클릭</span>`).join("")}
          </div>
          <div class="plot-frame">
            <div class="y-axis left">${yImp.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
            <div class="plot-main">
              <div class="gridlines">${yImp.map((_, i) => `<i style="top:${(i / (yImp.length - 1)) * 180}px"></i>`).join("")}</div>
              <div class="chart">
                ${slots.map((row) => {
                  const impParts = plats.map((p) => {
                    const v = row[p === "NAVER" ? "naver" : "google"].impressions;
                    const h = Math.round((v / topImp) * 180);
                    return h ? `<div class="seg ${p}" style="height:${h}px"></div>` : "";
                  }).join("");
                  return `<div class="col ${plats.length === 1 ? "one" : ""} ${row.key === selectedKey ? "on" : ""}" data-key="${row.key}" data-label="${periodLabel(row.key)}" data-naver-imp="${row.naver.impressions}" data-naver-clk="${row.naver.clicks}" data-google-imp="${row.google.impressions}" data-google-clk="${row.google.clicks}"><div class="track">${impParts}</div></div>`;
                }).join("")}
              </div>
              ${clickSvg}
              <div class="tip"></div>
              <div class="axis-row">
                <button class="pager" id="chartOlder" ${canOlder ? "" : "disabled"} aria-label="이전">‹</button>
                <div class="axis">${slots.map((row) => `<span class="show vert">${axisText(row.key)}</span>`).join("")}</div>
                <button class="pager" id="chartNewer" ${canNewer ? "" : "disabled"} aria-label="최근">›</button>
              </div>
            </div>
            <div class="y-axis right">${yClk.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
          </div>
          <h2>캠페인 · 그룹 · 키워드 · ${periodLabel(selected.key)}</h2>
          <table>
            <thead>
              <tr>
                <th>이름</th>
                <th>상태</th>
                <th>연관지수</th>
                <th>클릭기대</th>
                <th class="num">노출수</th>
                <th class="num">클릭수</th>
                <th class="num">총 전환수</th>
                <th class="num">클릭률(%)</th>
                <th class="num">평균 CPC</th>
                <th class="num">비용</th>
              </tr>
            </thead>
            <tbody>${tableRows.join("")}</tbody>
          </table>
          <div class="meta">왼쪽 축 노출(막대) · 오른쪽 축 클릭(꺾은선) · ${prettyRange(report.dateRange)}${report.notes?.length ? " · " + report.notes.join(" · ") : ""}</div>
        `;
        document.getElementById("chartNewer").onclick = () => { if (chartPage > 0) { chartPage -= 1; selectedKey = null; render(); } };
        document.getElementById("chartOlder").onclick = () => { if (chartPage < pageCount - 1) { chartPage += 1; selectedKey = null; render(); } };
        document.querySelectorAll(".col[data-key]").forEach((col) => {
          col.onclick = () => { selectedKey = col.dataset.key; render(); };
          col.onmouseenter = () => showChartTip(col);
          col.onmousemove = (event) => moveChartTip(event);
          col.onmouseleave = () => hideChartTip(col);
        });
        document.querySelectorAll(".toggle").forEach((btn) => {
          btn.onclick = () => {
            const id = btn.dataset.id;
            if (open.has(id)) open.delete(id); else open.add(id);
            render();
          };
        });
      }
      function showChartTip(col) {
        const tip = col.closest(".plot-main")?.querySelector(".tip");
        if (!tip) return;
        const platBlock = (id, imp, clk) => `
          <div class="tip-plat">
            <span class="tag ${id}">${labels[id]}</span>
            <div class="tip-metrics">
              <span class="k">노출수</span><span>${fmt(imp)}</span>
              <span class="k">클릭수</span><span>${fmt(clk)}</span>
            </div>
          </div>`;
        const blocks = [];
        if (current !== "GOOGLE") blocks.push(platBlock("NAVER", col.dataset.naverImp, col.dataset.naverClk));
        if (current !== "NAVER") blocks.push(platBlock("GOOGLE", col.dataset.googleImp, col.dataset.googleClk));
        tip.innerHTML = `<div class="tip-date">${col.dataset.label || ""}</div>${blocks.join("")}`;
        tip.classList.add("on");
      }
      function moveChartTip(event) {
        const frame = event.currentTarget.closest(".plot-main");
        const tip = frame?.querySelector(".tip");
        if (!tip || !frame) return;
        const box = frame.getBoundingClientRect();
        const x = event.clientX - box.left + 12;
        const y = event.clientY - box.top + 12;
        const maxX = box.width - tip.offsetWidth - 8;
        const maxY = box.height - tip.offsetHeight - 8;
        tip.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
        tip.style.top = `${Math.max(8, Math.min(y, maxY))}px`;
      }
      function hideChartTip(col) {
        const tip = (col && col.closest(".plot-main")?.querySelector(".tip")) || document.querySelector(".tip.on");
        if (tip) tip.classList.remove("on");
      }
      function prettyRange(range) {
        if (!range) return "";
        return `${range[0].replaceAll("-", ".")} → ${range[1].replaceAll("-", ".")}`;
      }
      let loading = false;
      let stamp = "";
      async function load() {
        if (loading) return;
        loading = true;
        try {
          const next = await window.TASSI.loadJson("ads", window.TASSI.api("ads") + (window.TASSI.isPages ? "" : "?t=" + Date.now()));
          const nextStamp = JSON.stringify(next.days || []);
          const first = !report;
          report = next;
          if (!initedOpen) {
            initedOpen = true;
            for (const camp of report.campaigns || []) open.add(camp.id);
          }
          if (first || nextStamp !== stamp) {
            stamp = nextStamp;
            render();
          }
        } finally {
          loading = false;
        }
      }
      load();
      setInterval(() => { if (!document.hidden) load(); }, 60000);
    </script>
  </body>
</html>

services:
  db:
    image: postgres:16-alpine
    container_name: seo-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_report
    ports:
      - "5432:5432"
    volumes:
      - seo_report_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_report"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seo_report_pgdata:

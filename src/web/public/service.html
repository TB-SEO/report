<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서비스 · T-ASSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: "Pretendard Variable", sans-serif;
        font-size: 15px;
        line-height: 15px;
        letter-spacing: -0.3px;
        font-weight: 400;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; }
      .kicker { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
      h1 { font-size: 30px; line-height: 30px; font-weight: 400; letter-spacing: -0.3px; margin: 0 0 8px; color: var(--fg); }
      h2 { font-size: 16px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; margin: 28px 0 12px; color: var(--fg); }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 28px 0 12px; }
      .section-head h2 { margin: 0; }
      .note { color: var(--muted); font-size: 13px; line-height: 20px; margin: 0 0 16px; }
      .units { display: flex; gap: 8px; margin: 0 0 20px; }
      .units button {
        font-family: inherit;
        font-size: 13px;
        line-height: 18px;
        padding: 6px 12px;
        border: 1px solid var(--hairline);
        border-radius: 4px;
        background: #fff;
        color: var(--fg);
        cursor: pointer;
      }
      .units button.on { border-color: var(--action); color: var(--action); font-weight: 700; }
      .grains { display: flex; gap: 6px; align-items: center; }
      button { font-family: inherit; letter-spacing: -0.3px; cursor: pointer; }
      .grain {
        height: 32px; padding: 0 8px; border: 1px solid var(--hairline); border-radius: 4px;
        background: transparent; color: var(--fg); font-size: 14px; line-height: 18px;
      }
      .grain.on { border-color: var(--action); background: var(--action); color: #ffffff; }
      .period-label { min-width: 148px; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--fg); margin: 0 0 12px; }
      .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-bottom: 20px; }
      article .label { color: var(--muted); font-size: 13px; line-height: 15px; }
      article .value { font-size: 28px; line-height: 30px; font-weight: 400; margin-top: 6px; color: var(--fg); }
      .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; }
      .plot-frame {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 36px;
        column-gap: 8px;
        align-items: start;
      }
      .y-axis {
        height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        line-height: 12px;
      }
      .y-axis.left { text-align: right; }
      .y-axis.right { text-align: left; }
      .plot-main { position: relative; min-width: 0; }
      .gridlines { position: absolute; left: 0; right: 0; top: 0; height: 180px; pointer-events: none; }
      .gridlines i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hairline); }
      .chart {
        display: grid;
        grid-template-columns: repeat(14, minmax(0, 1fr));
        align-items: end;
        height: 180px;
        width: 100%;
      }
      .col {
        width: 100%;
        height: 180px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        cursor: pointer;
      }
      .col.on { box-shadow: inset 0 -2px 0 var(--fg); }
      .track {
        height: 180px;
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
      }
      .seg { width: 6px; min-height: 1px; border-radius: 1px 1px 0 0; }
      .seg.visit { background: #2d5be3; }
      .seg.start { background: #00a1ff; }
      .seg.result { background: #12b886; }
      .axis-row { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
      .pager {
        width: 14px; height: 14px; flex: none; padding: 0; margin-top: 0;
        border: 0; background: transparent; color: var(--muted); font-size: 12px; line-height: 14px;
      }
      .pager:disabled { color: var(--hairline); cursor: default; }
      .axis {
        display: grid;
        grid-template-columns: repeat(14, minmax(0, 1fr));
        flex: 1;
        min-width: 0;
        height: 40px;
        color: var(--muted);
        font-size: 12px;
        line-height: 14px;
      }
      .axis span {
        width: 100%;
        text-align: center;
        white-space: nowrap;
      }
      .axis span.show.vert {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        height: 40px;
        line-height: 12px;
      }
      .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
      .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 6px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px 8px 10px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; line-height: 18px; vertical-align: top; }
      th { color: var(--muted); font-weight: 400; }
      .num { text-align: right; white-space: nowrap; }
      .mono { font-size: 12px; color: var(--muted); word-break: break-all; }
      .empty { color: var(--muted); padding: 24px 0; }
      .section-head .icon-btn { flex: none; }
      .icon-btn {
        width: 32px; height: 32px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid var(--hairline); border-radius: 4px;
        background: #fff; color: var(--fg);
      }
      .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--action); color: var(--action); outline: none; }
      .ico { display: block; }
      .ico path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .more { color: var(--muted); font-size: 13px; line-height: 18px; margin: 8px 0 0; }
      .period-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
      .period-row .period-label { margin: 0; }
      .drawer { display: none; }
      .drawer.on { display: block; }
      .drawer-backdrop {
        position: fixed; inset: 0; background: rgba(27, 31, 39, 0.4); z-index: 80;
      }
      .drawer-panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
        background: #fff; z-index: 81; overflow: auto;
        box-shadow: -12px 0 32px rgba(15, 23, 42, 0.12);
        padding: 20px 20px 48px;
      }
      .drawer-head {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
        position: sticky; top: -20px; margin: -20px -20px 16px; padding: 20px 20px 12px;
        background: #fff; border-bottom: 1px solid var(--hairline);
      }
      .drawer-head h2 { margin: 0; font-size: 18px; line-height: 24px; }
      .drawer-head .sub { color: var(--muted); font-size: 13px; line-height: 18px; margin-top: 4px; font-weight: 400; }
      .drawer-panel h3 { font-size: 15px; line-height: 22px; font-weight: 700; margin: 22px 0 10px; color: var(--fg); }
      body.drawer-on { overflow: hidden; }
      @media (max-width: 900px) {
        .cards, .grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 640px) {
        .cards, .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="kicker">ShipType 시뮬레이터 · <a href="https://shiptype.scoopurl.co.kr/">라이브</a></div>
      <h1>서비스 이용자 현황</h1>
      <div class="units" id="units"></div>
      <div class="cards" id="cards"></div>
      <div class="section-head">
        <h2 id="chartHead">일간 이용</h2>
        <div class="grains" id="grains"></div>
      </div>
      <div id="chart"></div>
      <div class="grid">
        <div>
          <h2>퍼널</h2>
          <div id="funnel"></div>
        </div>
        <div>
          <h2>결과 분포</h2>
          <div id="results"></div>
        </div>
      </div>
      <div class="section-head">
        <h2>유입</h2>
        <button type="button" class="icon-btn" data-drawer="sources" aria-label="유입 상세 보기"></button>
      </div>
      <div id="sources"></div>
      <div class="section-head">
        <h2>브라우저</h2>
        <button type="button" class="icon-btn" data-drawer="browsers" aria-label="브라우저 상세 보기"></button>
      </div>
      <div id="browsers"></div>
      <div class="section-head">
        <h2>IP 단위</h2>
        <button type="button" class="icon-btn" data-drawer="ips" aria-label="IP 상세 보기"></button>
      </div>
      <div id="ips"></div>
      <div class="section-head">
        <h2>최근 이벤트</h2>
        <button type="button" class="icon-btn" data-drawer="timeline" aria-label="이벤트 상세 보기"></button>
      </div>
      <div id="timeline"></div>
    </div>
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <div class="drawer-head">
          <div>
            <h2 id="drawerTitle">상세</h2>
            <div class="sub" id="drawerSub"></div>
          </div>
          <button type="button" class="icon-btn" id="drawerClose" aria-label="닫기"></button>
        </div>
        <div id="drawerBody"></div>
      </aside>
    </div>
    <script src="site.js"></script>
    <script src="nav.js"></script>
    <script>
      const FUNNEL = ["visit", "start", "result", "cta_click", "share", "save_image", "retry"];
      const LABELS = {
        visit: "인트로 (/)",
        start: "/play 진입",
        result: "결과",
        cta_click: "T-ASSI 살펴보기",
        share: "공유",
        save_image: "이미지 저장",
        retry: "다시 하기",
      };
      const COLORS = { visit: "#2d5be3", start: "#00a1ff", result: "#12b886", cta_click: "#f86400", share: "#9b59b6", save_image: "#e0972d", retry: "#828c94" };
      const SERIES = ["visit", "start", "result"];
      const grainLabels = { day: "일간", week: "주간", month: "월간" };
      const PAGE_SIZE = 14;
      const SUMMARY_ROWS = 5;
      const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
      const dash = (v) => (v == null || v === "" ? "—" : v);
      const shortId = (id) => String(id || "").slice(0, 8);
      const ICO = {
        chevron: '<svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
        close: '<svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      };
      let report = null;
      let unit = "browser";
      let grain = "day";
      let selectedKey = null;
      let chartPage = 0;
      let drawerOpen = false;
      let drawerSection = "sources";

      function shortDay(ymd) {
        const [, m, d] = (ymd || "").split("-");
        return `${Number(m)}/${Number(d)}`;
      }
      function niceCeil(n) {
        if (n <= 0) return 1;
        const pow = Math.pow(10, Math.floor(Math.log10(n)));
        const d = n / pow;
        const nice = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => d <= s) || 10;
        const v = nice * pow;
        return v >= 10 ? Math.round(v) : Math.round(v * 100) / 100;
      }
      function kstToday() {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
      }
      function addDays(ymd, delta) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        date.setUTCDate(date.getUTCDate() + delta);
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(date);
      }
      function weekStart(ymd) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        const offset = (date.getUTCDay() + 6) % 7;
        return addDays(ymd, -offset);
      }
      function periodKey(ymd) {
        if (grain === "month") return ymd.slice(0, 7);
        if (grain === "week") return weekStart(ymd);
        return ymd;
      }
      function periodLabel(key) {
        if (grain === "month") {
          const [y, m] = key.split("-");
          return `${y}년 ${Number(m)}월`;
        }
        if (grain === "week") return `${shortDay(key)} – ${shortDay(addDays(key, 6))}`;
        return shortDay(key);
      }
      function axisText(key) {
        if (grain === "month") return `${Number(key.slice(5))}월`;
        return shortDay(key);
      }
      function currentPeriodKey() { return periodKey(kstToday()); }
      function previousPeriodKey(key) {
        if (grain === "month") {
          const [y, m] = key.split("-").map(Number);
          const date = new Date(Date.UTC(y, m - 2, 1));
          return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}`;
        }
        if (grain === "week") return addDays(key, -7);
        return addDays(key, -1);
      }
      function emptyBucket(key) {
        return { key, visit: 0, start: 0, result: 0 };
      }
      function table(headers, rows, empty, more) {
        if (!rows.length) return `<p class="empty">${empty}</p>`;
        return `<table><thead><tr>${headers.map((h) => `<th${h.num ? ' class="num"' : ""}>${h.label}</th>`).join("")}</tr></thead>
          <tbody>${rows.map((row) => `<tr>${row.join("")}</tr>`).join("")}</tbody></table>${more ? `<p class="more">${more}</p>` : ""}`;
      }
      function personKey(event) {
        if (unit === "ip") return event.lastIpMasked || event.clientIpMasked || "";
        return event.visitorId;
      }
      function inPeriod(ymd, key) {
        return ymd && periodKey(ymd) === key;
      }
      function moreText(total, shown, unitLabel) {
        const rest = total - shown;
        if (rest <= 0) return "";
        return `외 ${fmt(rest)}${unitLabel}`;
      }
      function groupRecent(events, limit) {
        const groups = [];
        for (const e of events) {
          const last = groups[groups.length - 1];
          if (last && last.visitorId === e.visitorId) last.items.push(e);
          else {
            if (limit && groups.length >= limit) break;
            groups.push({ visitorId: e.visitorId, items: [e] });
          }
        }
        return groups;
      }
      function timelineRows(groups) {
        return groups.map((group) => {
          const e = group.items[0];
          const n = group.items.length;
          const label = LABELS[e.eventName] || e.eventName;
          const result = group.items.find((row) => row.resultName)?.resultName;
          const play = group.items.find((row) => row.playId)?.playId;
          return [
            `<td>${new Date(e.occurredAt).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" })}</td>`,
            `<td>${label}${n > 1 ? ` + ${n}건` : ""}</td>`,
            `<td>${dash(result)}</td>`,
            `<td class="mono">${shortId(e.visitorId)}</td>`,
            `<td class="mono">${play ? shortId(play) : "—"}</td>`,
            `<td>${window.TASSI.landingPathHtml(e.firstLandingPath || e.landingPath)}</td>`,
            `<td class="mono">${dash(e.clientIpMasked || e.lastIpMasked)}</td>`,
          ];
        });
      }
      function sourceRowsFromVisitors(list) {
        const srcMap = new Map();
        for (const v of list) {
          const key = [
            v.firstLandingPath || "(없음)",
            v.firstUtmSource || "(UTM 없음)",
            v.firstUtmCampaign || "—",
            v.firstUtmContent || "—",
          ].join("\t");
          srcMap.set(key, (srcMap.get(key) || 0) + 1);
        }
        return [...srcMap.entries()].sort((a, b) => b[1] - a[1]).map(([key, n]) => {
          const [path, s, c, t] = key.split("\t");
          return [`<td>${window.TASSI.landingPathHtml(path, "(없음)")}</td>`, `<td>${s}</td>`, `<td>${c}</td>`, `<td>${t}</td>`, `<td class="num">${fmt(n)}</td>`];
        });
      }
      function browserRows(list) {
        return list.map((v) => [
          `<td class="mono">${shortId(v.id)}</td>`,
          `<td>${window.TASSI.landingPathHtml(v.firstLandingPath)}</td>`,
          `<td class="mono">${dash(v.lastIpMasked)}</td>`,
          `<td class="num">${fmt(v.eventCount)}</td>`,
          `<td>${new Date(v.lastSeenAt).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" })}</td>`,
        ]);
      }
      function ipRowsFromVisitors(list) {
        const ipMap = new Map();
        for (const v of list) {
          if (!v.lastIpMasked) continue;
          const cur = ipMap.get(v.lastIpMasked) || { browsers: 0, events: 0 };
          cur.browsers += 1;
          cur.events += v.eventCount;
          ipMap.set(v.lastIpMasked, cur);
        }
        return [...ipMap.entries()].sort((a, b) => b[1].browsers - a[1].browsers).map(([ip, row]) => [
          `<td class="mono">${ip}</td>`,
          `<td class="num">${fmt(row.browsers)}</td>`,
          `<td class="num">${fmt(row.events)}</td>`,
        ]);
      }
      function periodSlice(events, visitors, key) {
        const dayEvents = events.filter((e) => inPeriod(e.date, key));
        const ids = new Set(dayEvents.map((e) => e.visitorId));
        const dayVisitors = visitors.filter((v) => ids.has(v.id));
        return { dayEvents, dayVisitors };
      }
      function bindDrawerButtons() {
        document.querySelectorAll("[data-drawer]").forEach((btn) => {
          if (!btn.innerHTML.trim()) btn.innerHTML = ICO.chevron;
          btn.onclick = () => openDrawer(btn.dataset.drawer);
        });
        const close = document.getElementById("drawerClose");
        close.innerHTML = ICO.close;
        close.onclick = closeDrawer;
        document.getElementById("drawerBackdrop").onclick = closeDrawer;
      }
      function openDrawer(section) {
        drawerOpen = true;
        drawerSection = section || "sources";
        fillDrawer();
        const el = document.getElementById("drawer");
        el.hidden = false;
        el.classList.add("on");
        document.body.classList.add("drawer-on");
        const target = document.getElementById(`drawer-${drawerSection}`);
        if (target) target.scrollIntoView({ block: "start" });
      }
      function closeDrawer() {
        drawerOpen = false;
        const el = document.getElementById("drawer");
        el.hidden = true;
        el.classList.remove("on");
        document.body.classList.remove("drawer-on");
      }
      function fillDrawer() {
        if (!report || !selectedKey) return;
        const events = report.events || [];
        const visitors = report.visitors || [];
        const { dayEvents, dayVisitors } = periodSlice(events, visitors, selectedKey);
        const src = sourceRowsFromVisitors(dayVisitors);
        const browsers = [...dayVisitors].sort((a, b) => String(b.lastSeenAt).localeCompare(String(a.lastSeenAt)));
        const ips = ipRowsFromVisitors(dayVisitors);
        const groups = groupRecent(dayEvents);
        document.getElementById("drawerTitle").textContent = `${periodLabel(selectedKey)} 상세`;
        document.getElementById("drawerSub").textContent = `이벤트 ${fmt(dayEvents.length)} · 브라우저 ${fmt(dayVisitors.length)}`;
        document.getElementById("drawerBody").innerHTML = `
          <h3 id="drawer-sources">유입</h3>
          ${table(
            [{ label: "방문 경로" }, { label: "source" }, { label: "campaign" }, { label: "content" }, { label: "브라우저", num: true }],
            src,
            "유입 기록이 없습니다.",
          )}
          <h3 id="drawer-browsers">브라우저</h3>
          ${table(
            [{ label: "visitor" }, { label: "방문 경로" }, { label: "IP" }, { label: "이벤트", num: true }, { label: "마지막" }],
            browserRows(browsers),
            "브라우저 방문자가 없습니다.",
          )}
          <h3 id="drawer-ips">IP 단위</h3>
          ${table(
            [{ label: "IP (마스킹)" }, { label: "브라우저", num: true }, { label: "이벤트", num: true }],
            ips,
            "IP 기록이 없습니다.",
          )}
          <h3 id="drawer-timeline">이벤트</h3>
          ${table(
            [{ label: "시각" }, { label: "이벤트" }, { label: "결과" }, { label: "visitor" }, { label: "play" }, { label: "방문 경로" }, { label: "IP" }],
            timelineRows(groups),
            "이벤트가 없습니다.",
          )}
        `;
      }

      function render() {
        const events = report.events || [];
        const visitors = report.visitors || [];
        const stats = report.stats || {};
        document.getElementById("units").innerHTML = [
          ["browser", "집계: 브라우저"],
          ["ip", "집계: IP"],
        ].map(([id, label]) => `<button type="button" class="${unit === id ? "on" : ""}" data-unit="${id}">${label}</button>`).join("");
        document.querySelectorAll("#units button").forEach((btn) => {
          btn.onclick = () => { unit = btn.dataset.unit; render(); };
        });

        document.getElementById("cards").innerHTML = [
          ["브라우저", stats.browsers ?? visitors.length],
          ["IP 단위", stats.ips ?? 0],
          ["플레이", stats.plays ?? 0],
          ["T-ASSI 살펴보기", events.filter((e) => e.eventName === "cta_click").length],
          ["이벤트", stats.events ?? events.length],
        ].map(([label, value]) => `<article><div class="label">${label}</div><div class="value">${fmt(value)}</div></article>`).join("");

        document.getElementById("chartHead").textContent = `${grainLabels[grain]} 이용`;
        document.getElementById("grains").innerHTML = ["day", "week", "month"].map((id) =>
          `<button type="button" class="grain ${id === grain ? "on" : ""}" data-id="${id}">${grainLabels[id]}</button>`
        ).join("");
        document.querySelectorAll("#grains .grain").forEach((btn) => {
          btn.onclick = () => { grain = btn.dataset.id; selectedKey = null; chartPage = 0; render(); };
        });

        const byKey = new Map();
        for (const e of events) {
          if (!e.date || !SERIES.includes(e.eventName)) continue;
          const key = periodKey(e.date);
          if (!byKey.has(key)) byKey.set(key, emptyBucket(key));
          byKey.get(key)[e.eventName] += 1;
        }
        const oldest = [...byKey.keys()].sort()[0] || currentPeriodKey();
        let span = 0;
        for (let key = currentPeriodKey(); key >= oldest && span < 400; key = previousPeriodKey(key)) span += 1;
        const pageCount = Math.max(1, Math.ceil(span / PAGE_SIZE));
        if (chartPage > pageCount - 1) chartPage = pageCount - 1;
        if (chartPage < 0) chartPage = 0;
        let cursor = currentPeriodKey();
        for (let i = 0; i < chartPage * PAGE_SIZE; i++) cursor = previousPeriodKey(cursor);
        const slots = [];
        for (let i = 0; i < PAGE_SIZE; i++) {
          slots.push(byKey.get(cursor) || emptyBucket(cursor));
          cursor = previousPeriodKey(cursor);
        }
        slots.reverse();
        const latestData = [...slots].reverse().find((row) => row.visit || row.start || row.result);
        if (!selectedKey || !slots.some((row) => row.key === selectedKey)) selectedKey = (latestData || slots.at(-1)).key;
        const selected = slots.find((row) => row.key === selectedKey) || slots[0];
        const max = Math.max(1, ...slots.flatMap((row) => SERIES.map((k) => row[k] || 0)));
        const top = niceCeil(max);
        const yMarks = [top, top / 2, 0].map((t) => (Number.isInteger(t) ? t : Math.round(t * 10) / 10));
        const canNewer = chartPage > 0;
        const canOlder = chartPage < pageCount - 1;
        document.getElementById("chart").innerHTML = `
          <div class="period-row">
            <div class="period-label">${periodLabel(selected.key)} · 인트로 ${fmt(selected.visit)} · /play ${fmt(selected.start)} · 결과 ${fmt(selected.result)}</div>
            <button type="button" class="icon-btn" data-drawer="timeline" aria-label="이 기간 상세 보기">${ICO.chevron}</button>
          </div>
          <div class="legend">
            <span><i style="background:${COLORS.visit}"></i>인트로 (/)</span>
            <span><i style="background:${COLORS.start}"></i>/play 진입</span>
            <span><i style="background:${COLORS.result}"></i>결과</span>
          </div>
          <div class="plot-frame">
            <div class="y-axis left">${yMarks.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
            <div class="plot-main">
              <div class="gridlines">${yMarks.map((_, i) => `<i style="top:${(i / (yMarks.length - 1)) * 180}px"></i>`).join("")}</div>
              <div class="chart">
                ${slots.map((row) => {
                  const parts = SERIES.map((k) => {
                    const h = Math.round(((row[k] || 0) / top) * 180);
                    return h ? `<div class="seg ${k}" style="height:${h}px"></div>` : "";
                  }).join("");
                  return `<div class="col ${row.key === selectedKey ? "on" : ""}" data-key="${row.key}"><div class="track">${parts}</div></div>`;
                }).join("")}
              </div>
              <div class="axis-row">
                <button type="button" class="pager" id="chartOlder" ${canOlder ? "" : "disabled"} aria-label="이전">‹</button>
                <div class="axis">${slots.map((row) => `<span class="show vert">${axisText(row.key)}</span>`).join("")}</div>
                <button type="button" class="pager" id="chartNewer" ${canNewer ? "" : "disabled"} aria-label="최근">›</button>
              </div>
            </div>
            <div class="y-axis right">${yMarks.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
          </div>`;
        document.getElementById("chartNewer").onclick = () => { if (chartPage > 0) { chartPage -= 1; selectedKey = null; render(); } };
        document.getElementById("chartOlder").onclick = () => { if (chartPage < pageCount - 1) { chartPage += 1; selectedKey = null; render(); } };
        document.querySelectorAll("#chart .col[data-key]").forEach((col) => {
          col.onclick = () => { selectedKey = col.dataset.key; render(); };
        });

        const funnelRows = FUNNEL.map((name) => {
          const list = events.filter((e) => e.eventName === name);
          const people = new Set(list.map(personKey).filter(Boolean)).size;
          return [name, list.length, people];
        }).filter((row) => row[1] || row[0] === "visit" || row[0] === "start" || row[0] === "result");
        const peopleLabel = unit === "ip" ? "IP" : "브라우저";
        document.getElementById("funnel").innerHTML = table(
          [{ label: "단계" }, { label: "횟수", num: true }, { label: peopleLabel, num: true }],
          funnelRows.map(([name, n, people]) => [
            `<td>${LABELS[name] || name}</td>`,
            `<td class="num">${fmt(n)}</td>`,
            `<td class="num">${fmt(people)}</td>`,
          ]),
          "아직 이벤트가 없습니다.",
        );

        const resultMap = new Map();
        for (const e of events) {
          if (e.eventName !== "result") continue;
          const key = e.resultName || "(이름 없음)";
          resultMap.set(key, (resultMap.get(key) || 0) + 1);
        }
        const resultRows = [...resultMap.entries()].sort((a, b) => b[1] - a[1]);
        document.getElementById("results").innerHTML = table(
          [{ label: "결과" }, { label: "건수", num: true }],
          resultRows.map(([name, n]) => [`<td>${name}</td>`, `<td class="num">${fmt(n)}</td>`]),
          "아직 결과 이벤트가 없습니다.",
        );

        const srcAll = sourceRowsFromVisitors(visitors);
        document.getElementById("sources").innerHTML = table(
          [{ label: "방문 경로" }, { label: "source" }, { label: "campaign" }, { label: "content" }, { label: "브라우저", num: true }],
          srcAll.slice(0, SUMMARY_ROWS),
          "유입 기록이 없습니다.",
          moreText(srcAll.length, Math.min(SUMMARY_ROWS, srcAll.length), "개 경로"),
        );

        const browsersSorted = [...visitors].sort((a, b) => String(b.lastSeenAt).localeCompare(String(a.lastSeenAt)));
        document.getElementById("browsers").innerHTML = table(
          [{ label: "visitor" }, { label: "방문 경로" }, { label: "IP" }, { label: "이벤트", num: true }, { label: "마지막" }],
          browserRows(browsersSorted.slice(0, SUMMARY_ROWS)),
          "브라우저 방문자가 없습니다.",
          moreText(browsersSorted.length, Math.min(SUMMARY_ROWS, browsersSorted.length), "명"),
        );

        const ipAll = ipRowsFromVisitors(visitors);
        document.getElementById("ips").innerHTML = table(
          [{ label: "IP (마스킹)" }, { label: "브라우저", num: true }, { label: "이벤트", num: true }],
          ipAll.slice(0, SUMMARY_ROWS),
          "IP 기록이 없습니다.",
          moreText(ipAll.length, Math.min(SUMMARY_ROWS, ipAll.length), "개"),
        );

        const recentGroups = groupRecent(events);
        document.getElementById("timeline").innerHTML = table(
          [{ label: "시각" }, { label: "이벤트" }, { label: "결과" }, { label: "visitor" }, { label: "play" }, { label: "방문 경로" }, { label: "IP" }],
          timelineRows(recentGroups.slice(0, SUMMARY_ROWS)),
          "이벤트가 없습니다.",
          moreText(recentGroups.length, Math.min(SUMMARY_ROWS, recentGroups.length), "건"),
        );

        bindDrawerButtons();
        if (drawerOpen) fillDrawer();
      }

      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && drawerOpen) closeDrawer();
      });
      window.TASSI.loadService()
        .then((data) => { report = data; render(); })
        .catch((err) => {
          document.getElementById("cards").innerHTML = `<p class="empty">${err.message || "불러오지 못했습니다."}</p>`;
        });
    </script>
  </body>
</html>

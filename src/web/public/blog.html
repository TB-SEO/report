<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>블로그 · T-ASSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
      :root {
        --canvas: #ffffff;
        --text: #424242;
        --fg: #2f3438;
        --muted: #828c94;
        --action: #00a1ff;
        --hairline: #e0e0e0;
        --input: #141414;
        --tistory: #f86400;
        --velog: #12b886;
        --brunch: #00c6be;
        --shadow: 0px 2px 5px rgba(63, 71, 77, 0.15);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: "Pretendard Variable", sans-serif;
        font-size: 15px;
        line-height: 15px;
        letter-spacing: -0.3px;
        font-weight: 400;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; }
      .kicker { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
      h1 { font-size: 30px; line-height: 30px; font-weight: 400; letter-spacing: -0.3px; margin: 0 0 20px; color: var(--fg); }
      h2 { font-size: 16px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 12px; color: var(--fg); }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
      .tabs, .grains, .nav { display: flex; gap: 6px; align-items: center; }
      button { font-family: inherit; letter-spacing: -0.3px; cursor: pointer; }
      .tab {
        height: 32px; padding: 0 8px; border: 1px solid var(--hairline); border-radius: 4px;
        background: transparent; color: var(--fg); font-size: 14px; line-height: 18px;
      }
      .tab.on { border: 0; background: transparent; color: var(--action); font-size: 16px; line-height: 20px; font-weight: 700; height: 20px; padding: 0; }
      .tab[data-id="TISTORY"].on { color: var(--tistory); }
      .tab[data-id="VELOG"].on { color: var(--velog); }
      .tab[data-id="BRUNCH"].on { color: var(--brunch); }
      .grain {
        height: 32px; padding: 0 8px; border: 1px solid var(--hairline); border-radius: 4px;
        background: transparent; color: var(--fg); font-size: 14px; line-height: 18px;
      }
      .grain.on { border-color: var(--action); background: var(--action); color: #ffffff; }
      .axis-row { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
      .pager {
        width: 14px; height: 14px; flex: none; padding: 0; margin-top: 0;
        border: 0; background: transparent; color: var(--muted);
        font-size: 12px; line-height: 14px;
      }
      .pager:disabled { color: var(--hairline); cursor: default; }
      .period-label { min-width: 148px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--fg); }
      .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
      article { background: transparent; padding: 0; border: 0; border-radius: 0; }
      article .label { color: var(--muted); font-size: 15px; line-height: 15px; }
      article .value { font-size: 30px; line-height: 30px; font-weight: 400; margin-top: 6px; color: var(--fg); }
      .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
      .plot-frame {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 36px;
        column-gap: 8px;
        align-items: start;
      }
      .y-axis {
        height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        line-height: 12px;
      }
      .y-axis.left { text-align: right; }
      .y-axis.right { text-align: left; }
      .plot-main { position: relative; min-width: 0; }
      .gridlines { position: absolute; left: 0; right: 0; top: 0; height: 180px; pointer-events: none; }
      .gridlines i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hairline); }
      .chart {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 180px;
        width: 100%;
        padding: 0 18px;
      }
      .col {
        width: 22px;
        flex: none;
        height: 180px;
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
      }
      .col.empty { cursor: default; }
      .col.on { box-shadow: inset 0 -2px 0 var(--fg); }
      .seg { width: 6px; min-height: 1px; border-radius: 1px 1px 0 0; }
      .col.one { width: 12px; }
      .col.one .seg { width: 10px; }
      .seg.TISTORY { background: var(--tistory); }
      .seg.VELOG { background: var(--velog); }
      .seg.BRUNCH { background: var(--brunch); }
      .axis {
        display: flex;
        justify-content: space-between;
        flex: 1;
        min-width: 0;
        height: 40px;
        color: var(--muted);
        font-size: 12px;
        line-height: 14px;
      }
      .axis span {
        width: 22px;
        flex: none;
        text-align: center;
        white-space: nowrap;
        overflow: visible;
      }
      .axis span.show.vert {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        height: 40px;
        line-height: 12px;
      }
      .legend { display: flex; gap: 12px; font-size: 15px; color: var(--muted); margin-bottom: 12px; }
      .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; line-height: 24px; }
      th { color: var(--muted); font-weight: 400; }
      td.num, th.num { text-align: right; }
      .meta { color: var(--muted); font-size: 15px; line-height: 24px; margin-top: 12px; }
      .foot { margin-top: 40px; }
      .foot a { color: var(--muted); font-weight: 400; font-size: 15px; line-height: 15px; }
      a { color: var(--action); text-decoration: none; font-weight: 700; font-size: 16px; line-height: 20px; }
      .tag { font-weight: 400; font-size: 15px; margin-right: 6px; }
      .tag.TISTORY { color: var(--tistory); }
      .tag.VELOG { color: var(--velog); }
      .tag.BRUNCH { color: var(--brunch); }
      @media (max-width: 900px) {
        .cards, .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <script src="site.js"></script>
    <script src="nav.js"></script>
    <div class="wrap">
      <div class="kicker">T-ASSI 블로그 통계</div>
      <h1>조회·유입 현황</h1>
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <div class="grains" id="grains"></div>
      </div>
      <div id="app"></div>
      <p class="meta foot"><a href="check.html">수집 확인</a></p>
    </div>
    <script>
      const labels = { ALL: "종합", TISTORY: "티스토리", VELOG: "벨로그", BRUNCH: "브런치" };
      const grainLabels = { day: "일간", week: "주간", month: "월간" };
      let current = "ALL";
      let grain = "week";
      let selectedKey = null;
      let chartPage = 0;
      let report = null;
      const PAGE_SIZE = 14;

      const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");

      function kstToday() {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
      }
      function addDays(ymd, delta) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        date.setUTCDate(date.getUTCDate() + delta);
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(date);
      }
      function weekStart(ymd) {
        const date = new Date(`${ymd}T12:00:00+09:00`);
        const offset = (date.getUTCDay() + 6) % 7;
        return addDays(ymd, -offset);
      }
      function periodKey(ymd) {
        if (grain === "month") return ymd.slice(0, 7);
        if (grain === "week") return weekStart(ymd);
        return ymd;
      }
      function periodLabel(key) {
        if (grain === "month") {
          const [y, m] = key.split("-");
          return `${y}년 ${Number(m)}월`;
        }
        if (grain === "week") return `${shortDay(key)} – ${shortDay(addDays(key, 6))}`;
        return shortDay(key);
      }
      function shortDay(ymd) {
        const [, m, d] = ymd.split("-");
        return `${Number(m)}/${Number(d)}`;
      }
      function niceCeil(n) {
        if (n <= 0) return 1;
        const pow = Math.pow(10, Math.floor(Math.log10(n)));
        const d = n / pow;
        const nice = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => d <= s) || 10;
        const v = nice * pow;
        return v >= 10 ? Math.round(v) : Math.round(v * 100) / 100;
      }
      function axisText(row) {
        if (!row) return "";
        if (grain === "month") return `${Number(row.key.slice(5))}월`;
        return shortDay(row.key);
      }
      function currentPeriodKey() { return periodKey(kstToday()); }
      function previousPeriodKey(key) {
        if (grain === "month") {
          const [y, m] = key.split("-").map(Number);
          const date = new Date(Date.UTC(y, m - 2, 1));
          return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}`;
        }
        if (grain === "week") return addDays(key, -7);
        return addDays(key, -1);
      }
      function activePlatforms() {
        if (current === "ALL") return report.platforms;
        return report.platforms.filter((p) => p.platform === current);
      }
      function emptyBucket(key) {
        return {
          key, views: 0, visitors: 0,
          byPlatform: { TISTORY: 0, VELOG: 0, BRUNCH: 0 },
          sources: {}, keywords: {}, posts: [],
        };
      }
      function buckets() {
        const map = new Map();
        for (const platform of activePlatforms()) {
          for (const row of platform.snapshots || []) {
            const key = periodKey(row.date);
            if (!map.has(key)) {
              map.set(key, {
                key, views: 0, visitors: 0,
                byPlatform: { TISTORY: 0, VELOG: 0, BRUNCH: 0 },
                sources: {}, keywords: {}, posts: [],
              });
            }
            const bucket = map.get(key);
            bucket.views += row.views || 0;
            bucket.visitors += row.visitors || 0;
            bucket.byPlatform[platform.platform] += row.views || 0;
            for (const src of row.sources || []) {
              if (src.views) bucket.sources[src.sourceName] = (bucket.sources[src.sourceName] || 0) + src.views;
            }
            for (const kw of row.inflowKeywords || []) {
              if (kw.views) bucket.keywords[kw.keyword] = (bucket.keywords[kw.keyword] || 0) + kw.views;
            }
            for (const post of row.popularPosts || []) bucket.posts.push({ ...post, platform: platform.platform });
          }
        }
        return [...map.values()].sort((a, b) => a.key.localeCompare(b.key));
      }
      function contentPosts() {
        return activePlatforms().flatMap((p) => (p.posts || []).map((post) => ({ ...post, platform: p.platform })))
          .sort((a, b) => (b.views || 0) - (a.views || 0));
      }
      function entries(obj) {
        return Object.entries(obj).map(([name, views]) => ({ name, views })).sort((a, b) => b.views - a.views);
      }
      function bindChrome() {
        const tabIds = ["ALL", "TISTORY", "VELOG", "BRUNCH"];
        document.getElementById("tabs").innerHTML = tabIds.map((id) =>
          `<button class="tab ${id === current ? "on" : ""}" data-id="${id}">${labels[id]}</button>`
        ).join("");
        document.getElementById("tabs").querySelectorAll("button").forEach((btn) => {
          btn.onclick = () => { current = btn.dataset.id; selectedKey = null; chartPage = 0; render(); };
        });
        document.getElementById("grains").innerHTML = ["day", "week", "month"].map((id) =>
          `<button class="grain ${id === grain ? "on" : ""}" data-id="${id}">${grainLabels[id]}</button>`
        ).join("");
        document.getElementById("grains").querySelectorAll("button").forEach((btn) => {
          btn.onclick = () => { grain = btn.dataset.id; selectedKey = null; chartPage = 0; render(); };
        });
      }

      function render() {
        if (!report) return;
        bindChrome();
        const rows = buckets();
        const fallbackPosts = contentPosts();
        const fallbackTotal = activePlatforms().reduce((sum, p) => sum + (p.totalViews || 0), 0);
        if (!rows.length) {
          document.getElementById("app").innerHTML = `
            <div class="cards">
              <article><div class="label">총 조회수</div><div class="value">${fmt(fallbackTotal)}</div></article>
              <article><div class="label">콘텐츠</div><div class="value">${fmt(fallbackPosts.length)}</div></article>
            </div>
            <h2>콘텐츠</h2>
            <p class="meta">이 채널은 일별 추이가 없어 글별 총조회만 보여 줍니다.</p>
            <table>
              <thead><tr><th>글</th><th class="num">조회</th></tr></thead>
              <tbody>
                ${fallbackPosts.length ? fallbackPosts.map((post) => `<tr><td>${post.url ? `<a href="${post.url}" target="_blank">${post.title || post.url}</a>` : (post.title || "-")}</td><td class="num">${fmt(post.views)}</td></tr>`).join("") : `<tr><td colspan="2">글 통계가 없습니다.</td></tr>`}
              </tbody>
            </table>
          `;
          return;
        }
        const byKey = new Map(rows.map((row) => [row.key, row]));
        const oldest = rows.reduce((a, b) => (a.key < b.key ? a : b)).key;
        let span = 0;
        for (let key = currentPeriodKey(); key >= oldest && span < 400; key = previousPeriodKey(key)) span += 1;
        const pageCount = Math.max(1, Math.ceil(span / PAGE_SIZE));
        if (chartPage > pageCount - 1) chartPage = pageCount - 1;
        if (chartPage < 0) chartPage = 0;
        let cursor = currentPeriodKey();
        for (let i = 0; i < chartPage * PAGE_SIZE; i++) cursor = previousPeriodKey(cursor);
        const slots = [];
        for (let i = 0; i < PAGE_SIZE; i++) {
          slots.push(byKey.get(cursor) || emptyBucket(cursor));
          cursor = previousPeriodKey(cursor);
        }
        slots.reverse();
        const latestWithData = [...slots].reverse().find((row) => row.views > 0) ?? slots.at(-1);
        if (!selectedKey || !slots.some((row) => row.key === selectedKey)) selectedKey = latestWithData.key;
        const selected = slots.find((row) => row.key === selectedKey) || slots[0];
        const nowKey = currentPeriodKey();
        const prevKey = previousPeriodKey(nowKey);
        const nowViews = byKey.get(nowKey)?.views || 0;
        const prevViews = byKey.get(prevKey)?.views || 0;
        const stacked = current === "ALL";
        const plats = stacked ? ["TISTORY", "VELOG", "BRUNCH"] : [current];
        const max = Math.max(1, ...slots.flatMap((row) => stacked
          ? plats.map((p) => row.byPlatform[p] || 0)
          : [row.views]));
        const top = niceCeil(max);
        const ticks = [top, top / 2, 0];
        const yMarks = ticks.map((t) => (Number.isInteger(t) ? t : Math.round(t * 10) / 10));
        const sources = entries(selected?.sources || {});
        const keywords = entries(selected?.keywords || {}).slice(0, 10);
        const periodPosts = Object.values((selected?.posts || []).reduce((acc, post) => {
          const id = post.url || post.title;
          if (!acc[id] || (post.views || 0) > (acc[id].views || 0)) acc[id] = post;
          return acc;
        }, {})).sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 12);
        const posts = periodPosts;
        const barColor = current === "ALL" ? "" : current;
        const canNewer = chartPage > 0;
        const canOlder = chartPage < pageCount - 1;

        document.getElementById("app").innerHTML = `
          <div class="toolbar">
            <div class="period-label">${selected ? periodLabel(selected.key) : ""}</div>
          </div>
          <div class="cards">
            <article><div class="label">${grainLabels[grain]} 조회수</div><div class="value">${fmt(selected?.views)}</div></article>
            <article><div class="label">${grain === "day" ? "오늘" : grain === "week" ? "이번 주" : "이번 달"}</div><div class="value">${fmt(nowViews)}</div></article>
            <article><div class="label">${grain === "day" ? "어제" : grain === "week" ? "지난 주" : "지난 달"}</div><div class="value">${fmt(prevViews)}</div></article>
            <article><div class="label">기간 합계</div><div class="value">${fmt(rows.reduce((s, r) => s + r.views, 0))}</div></article>
          </div>
          <div class="grid">
            <div>
              <h2>${grainLabels[grain]} 조회수</h2>
              <div class="legend">
                ${(stacked ? ["TISTORY", "VELOG", "BRUNCH"] : [current]).map((id) =>
                  `<span><i style="background:var(--${id.toLowerCase()})"></i>${labels[id]}</span>`
                ).join("")}
              </div>
              <div class="plot-frame">
                <div class="y-axis left">${yMarks.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
                <div class="plot-main">
                  <div class="gridlines">${yMarks.map((_, i) => `<i style="top:${(i / (yMarks.length - 1)) * 180}px"></i>`).join("")}</div>
                  <div class="chart">
                    ${slots.map((row) => {
                      const parts = stacked
                        ? ["TISTORY", "VELOG", "BRUNCH"].map((p) => {
                            const h = Math.round(((row.byPlatform[p] || 0) / top) * 180);
                            return h ? `<div class="seg ${p}" style="height:${h}px"></div>` : "";
                          }).join("")
                        : (row.views
                          ? `<div class="seg ${barColor}" style="height:${Math.round((row.views / top) * 180)}px"></div>`
                          : "");
                      return `<div class="col ${plats.length === 1 ? "one" : ""} ${row.key === selectedKey ? "on" : ""}" data-key="${row.key}" title="${periodLabel(row.key)} ${fmt(row.views)}">${parts}</div>`;
                    }).join("")}
                  </div>
                  <div class="axis-row">
                    <button class="pager" id="chartOlder" ${canOlder ? "" : "disabled"} aria-label="이전 날짜">‹</button>
                    <div class="axis">${slots.map((row) => {
                      const text = axisText(row);
                      return `<span class="${text ? "show vert" : ""}">${text}</span>`;
                    }).join("")}</div>
                    <button class="pager" id="chartNewer" ${canNewer ? "" : "disabled"} aria-label="최근 날짜">›</button>
                  </div>
                </div>
                <div class="y-axis right">${yMarks.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
              </div>
            </div>
            <div>
              <h2>유입 · ${periodLabel(selected.key)}</h2>
              <table>
                <thead><tr><th>채널</th><th class="num">조회</th></tr></thead>
                <tbody>
                  ${sources.length ? sources.map((s) => `<tr><td>${s.name}</td><td class="num">${fmt(s.views)}</td></tr>`).join("") : `<tr><td colspan="2">이 기간 유입 데이터가 없습니다.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
          <div class="grid" style="margin-top:20px">
            <div>
              <h2>콘텐츠</h2>
              <table>
                <thead><tr><th>글</th><th class="num">조회</th></tr></thead>
                <tbody>
                  ${posts.length ? posts.map((post) => `<tr><td>${current === "ALL" ? `<span class="tag ${post.platform}">${labels[post.platform]}</span>` : ""}${post.url ? `<a href="${post.url}" target="_blank">${post.title || post.url}</a>` : (post.title || "-")}</td><td class="num">${fmt(post.views)}</td></tr>`).join("") : `<tr><td colspan="2">글 통계가 없습니다.</td></tr>`}
                </tbody>
              </table>
            </div>
            <div>
              <h2>유입 키워드</h2>
              <table>
                <thead><tr><th>키워드</th><th class="num">조회</th></tr></thead>
                <tbody>
                  ${keywords.length ? keywords.map((k) => `<tr><td>${k.name}</td><td class="num">${fmt(k.views)}</td></tr>`).join("") : `<tr><td colspan="2">키워드가 없습니다.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
          <div class="meta">${current === "ALL" ? "티스토리 + 벨로그 + 브런치" : (activePlatforms()[0]?.pageUrl || "")}</div>
        `;
        document.getElementById("chartNewer").onclick = () => {
          if (chartPage > 0) { chartPage -= 1; selectedKey = null; render(); }
        };
        document.getElementById("chartOlder").onclick = () => {
          if (chartPage < pageCount - 1) { chartPage += 1; selectedKey = null; render(); }
        };
        document.querySelectorAll(".col[data-key]").forEach((col) => {
          col.onclick = () => { selectedKey = col.dataset.key; render(); };
        });
      }

      async function load() {
        report = await window.TASSI.loadJson("report", window.TASSI.api("report"));
        render();
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>
